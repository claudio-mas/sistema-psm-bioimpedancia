<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
{{FONTS}}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #FFFFFF;
  color: #334155;
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  font-size: 13px;
  line-height: 1.35;
  -webkit-print-color-adjust: exact;
}
.rel { width: 100%; }

/* ---------- Cabeçalho ---------- */
.topo { position: relative; border-bottom: 2px solid #1a4f7c; padding-bottom: 6px; min-height: 50px; }
.topo h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 23px; font-weight: 700; color: #475569; line-height: 1.1; }
.topo .logo { position: absolute; right: 0; top: 0; height: 46px; width: auto; max-width: 210px; }
.ident { display: table; width: 100%; background: #e2e8f0; color: #475569; font-size: 10px; font-weight: 600; padding: 3px 6px; margin: 6px 0 12px; }
.ident .c { display: table-cell; padding-right: 12px; }
.ident .c span { font-weight: 400; }

/* ---------- Estrutura de colunas ---------- */
.main { display: table; width: 100%; table-layout: fixed; }
.main .left { display: table-cell; width: 63%; vertical-align: top; padding-right: 14px; }
.main .right { display: table-cell; width: 37%; vertical-align: top; }

.sec { margin-bottom: 14px; page-break-inside: avoid; }
.sec > h2 { font-size: 14px; font-weight: 700; color: #334155; border-bottom: 1px solid #cbd5e1; padding-bottom: 3px; margin-bottom: 8px; }
.sec.box { background: #f8fafc; border: 1px solid #eef2f6; border-radius: 6px; padding: 10px; }
.sec.box > h2 { color: #1a4f7c; border: 0; margin-bottom: 6px; }

/* ---------- Tabela composição / impedância ---------- */
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t thead th { background: #1a4f7c; color: #fff; font-weight: 600; padding: 5px 6px; text-align: left; border-right: 1px solid rgba(255,255,255,.2); font-size: 11px; }
table.t thead th.ctr { text-align: center; }
table.t tbody td { padding: 5px 6px; border-bottom: 1px solid #e9eef3; }
table.t tbody td.ctr { text-align: center; }
table.t tbody tr.alt { background: #f8fafc; }
table.t td.nome { font-weight: 600; color: #334155; }

/* ---------- Medidores (barras com marcador) ---------- */
table.mf { width: 100%; border-collapse: collapse; }
table.mf td { padding: 7px 0; vertical-align: middle; }
td.mf-lbl { width: 120px; font-size: 11px; font-weight: 700; color: #334155; }
td.mf-val { width: 96px; text-align: right; font-size: 11px; font-weight: 700; color: #1a4f7c; }
table.zones { width: 100%; border-collapse: collapse; }
table.zones td { text-align: center; font-size: 10px; font-weight: 700; padding: 2px 0; color: #64748b; }
table.zones td.z2 { background: #1a4f7c; color: #fff; }
table.zones td.z1, table.zones td.z3 { background: #f1f5f9; }
.track { position: relative; height: 8px; background: #e2e8f0; border-radius: 4px; }
.track .div { position: absolute; top: 0; height: 8px; border-left: 1px solid #fff; }
.marker { position: absolute; top: -4px; width: 4px; height: 16px; background: #1e293b; border-radius: 2px; }

/* ---------- Pontuação + controle ---------- */
.score .big { font-family: 'Playfair Display', Georgia, serif; font-size: 44px; font-weight: 700; color: #334155; line-height: 1; }
.score .big small { font-size: 16px; color: #94a3b8; font-weight: 600; }
.score .obs { font-size: 10px; color: #94a3b8; margin-top: 5px; }
.kv { width: 100%; border-collapse: collapse; font-size: 12px; }
.kv td { padding: 5px 1px; border-bottom: 1px solid #eef2f6; }
.kv td.v { text-align: right; font-weight: 700; color: #1f2937; }
.kv td.v.ac { color: #0ea5e9; }
.subh { font-size: 12px; font-weight: 700; color: #334155; margin: 10px 0 2px; }

/* ---------- Avaliação da obesidade (barras preenchidas) ---------- */
.ob { margin-bottom: 12px; }
.ob-top { display: table; width: 100%; font-size: 11px; }
.ob-top .a { display: table-cell; }
.ob-top .b { display: table-cell; text-align: right; font-weight: 700; }
.ob-track { position: relative; height: 14px; background: #e2e8f0; margin-top: 2px; }
.ob-fill { position: absolute; left: 0; top: 0; height: 14px; background: #1a4f7c; }
.ob-zones { display: table; width: 100%; margin-top: 2px; }
.ob-zones span { display: table-cell; font-size: 8px; color: #94a3b8; text-transform: uppercase; }
.ob-zones span.r { text-align: right; }
table.z3 { width: 100%; height: 14px; border-collapse: collapse; margin-top: 2px; }
table.z3 td { text-align: center; font-size: 8px; color: #fff; }
table.z3 td.a { background: #cbd5e1; color: #475569; } table.z3 td.b { background: #94a3b8; } table.z3 td.c { background: #1a4f7c; }

/* ---------- Tipo de corpo (grade 3x3) ---------- */
table.tc { width: 100%; border-collapse: collapse; }
table.tc td { border: 1px solid #e2e8f0; height: 38px; text-align: center; font-size: 9px; color: #64748b; padding: 2px; }
table.tc td.on { background: #1a4f7c; color: #fff; font-weight: 700; border-color: #1a4f7c; }
.tc-x { text-align: center; font-size: 8px; font-weight: 700; color: #64748b; margin-top: 3px; }

/* ---------- Figura segmentar ---------- */
table.segwrap { width: 100%; table-layout: fixed; border-collapse: collapse; }
table.segwrap > tbody > tr > td { width: 50%; vertical-align: top; padding-right: 8px; }
table.fig { width: 100%; border-collapse: collapse; }
table.fig td { vertical-align: middle; }
table.fig td.img { width: 84px; text-align: center; }
table.fig td.img img { height: 132px; width: auto; }
.seglbl { font-size: 9.5px; color: #475569; margin: 6px 0; line-height: 1.25; }
.seglbl.r { text-align: right; }
.seglbl b { color: #1f2937; }
.nota { font-size: 9px; color: #94a3b8; margin-top: 4px; }

/* ---------- Rodapé ---------- */
.foot { display: table; width: 100%; table-layout: fixed; border-top: 1px solid #cbd5e1; margin-top: 6px; padding-top: 10px; }
.foot .fc { display: table-cell; width: 50%; vertical-align: top; padding-right: 14px; }
</style>
</head>
<body>
<div class="rel">
{{CONTEUDO}}
</div>
</body>
</html>
