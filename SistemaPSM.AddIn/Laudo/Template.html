<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
{{FONTS}}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {}

html, body {
  background: #FDFBF7;            /* Alabastro */
  color: #1F1A17;                /* Grafite quente */
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-print-color-adjust: exact;
}

.laudo { width: 100%; padding: 0; }

/* ---------- Cabeçalho ---------- */
.marca { position: relative; min-height: 90px; margin-bottom: 6px; }
.marca-logo { position: absolute; right: 0; top: 0; height: 90px; width: auto; max-width: 280px; }
.marca-topo {
  font-size: 16px; letter-spacing: 2.5px; text-transform: uppercase;
  color: #8A9A70; font-weight: 600; text-align: left; padding-top: 33px;
}
.cab {
  border: 1px solid #E2DCD3; border-radius: 10px; background: #fff;
  padding: 9px 16px; margin-bottom: 9px; position: relative; overflow: hidden;
}
.cab:before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: #C5A059;
}
.cab-tabela { display: table; width: 100%; }
.cab-cel { display: table-cell; vertical-align: middle; }
.cab-nome { width: 46%; }
.cab-meta { text-align: center; border-left: 1px solid #E2DCD3; }
.rotulo { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #8A9A70; font-weight: 600; }
.cab-meta .rotulo { font-size: 12px; }
.cab-nome .nome {
  font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700;
  color: #1F1A17; line-height: 1.15; margin-top: 2px;
}
.cab-meta .v { font-size: 15px; font-weight: 600; color: #1F1A17; margin-top: 3px; }

/* ---------- Seções ---------- */
.secao { margin-bottom: 14px; page-break-inside: avoid; }
.secao h2 {
  font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700;
  color: #7A2B22; margin-bottom: 2px;
}
.secao .linha-ouro { height: 2px; background: #C5A059; width: 46px; margin-bottom: 6px; border-radius: 2px; }
.card {
  border: 1px solid #E2DCD3; border-radius: 10px; background: #fff; padding: 7px 14px;
}

/* ---------- Barras (composição corporal) ---------- */
.barra { display: table; width: 100%; margin: 4px 0; }
.barra > div { display: table-cell; vertical-align: middle; }
.b-lbl { width: 170px; font-size: 16px; color: #1F1A17; }
.b-lbl .un { color: #8A9A70; font-size: 14px; margin-left: 3px; }
.b-trilho-wrap { padding: 0 12px; }
.b-trilho {
  position: relative; height: 9px; background: #E2DCD3; border-radius: 5px;
}
.b-faixa {
  position: absolute; top: 0; height: 100%; background: #8A9A70; opacity: .45; border-radius: 5px;
}
.b-marca {
  position: absolute; top: -4px; width: 3px; height: 17px; background: #1F1A17; border-radius: 2px;
}
.b-esc { width: 64px; }
.b-val { width: 92px; text-align: right; font-weight: 700; color: #7A2B22; font-size: 17px; }
.b-val .vu { font-weight: 400; color: #8A9A70; font-size: 14px; margin-left: 2px; }
.b-escala { display: table; width: 100%; margin-top: 1px; }
.b-escala span { display: table-cell; font-size: 12.5px; color: #b9b0a4; }
.b-escala span.fim { text-align: right; }
.b-cls { font-size: 13.5px; color: #8A9A70; margin-top: 1px; }

/* ---------- Gráficos de série (circunferência e evolução) ---------- */
.gs-row { display: table; width: 100%; }
.gs-row > div { display: table-cell; vertical-align: middle; }
.gs-lbl { width: 170px; font-size: 16px; color: #1F1A17; }
.gs-plot svg { display: block; margin: 1px 0; }

/* ---------- Informação ---------- */
.info p { margin-bottom: 7px; font-size: 15px; color: #4a423b; }
.info p b { color: #7A2B22; }
</style>
</head>
<body>
<div class="laudo">
{{CONTEUDO}}
</div>
</body>
</html>
